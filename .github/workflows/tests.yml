name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12', '13']

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: >
          composer update --prefer-dist --no-interaction --no-progress
          --with="illuminate/support:^${{ matrix.laravel }}.0"
          --with="illuminate/auth:^${{ matrix.laravel }}.0"
          --with="illuminate/database:^${{ matrix.laravel }}.0"
          --with="illuminate/console:^${{ matrix.laravel }}.0"

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run tests
        run: vendor/bin/phpunit
