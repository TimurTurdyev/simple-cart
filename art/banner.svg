  <text x="340" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" fill="#c7d2fe">Shopping cart, wishlist and compare lists on one core</text>

